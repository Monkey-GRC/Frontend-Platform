name: Deploy dev (frontend-platform)

on:
  push:
    branches: [develop]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copiar código al VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "."
          target: "/home/ubuntu/monkey-dev/frontend-platform"
          rm: true

      - name: (Re)desplegar
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # script_stop: si un comando del script falla, el step (y el job)
          # deben fallar de verdad — sin esto, appleboy/ssh-action reporta
          # "success" aunque el build de Docker truene por dentro.
          script_stop: true
          script: |
            set -e
            cd /home/ubuntu/monkey-dev
            docker compose build frontend-platform
            docker compose up -d frontend-platform
