@if (navigating()) {
<div class="pointer-events-none fixed inset-x-0 top-0 z-[100003] h-0.5 overflow-hidden bg-primary/15" role="progressbar" aria-busy="true">
  <div class="h-full w-1/3 animate-[navbar_1.1s_ease-in-out_infinite] rounded-full bg-primary"></div>
</div>
}
<div class="min-h-screen xl:flex">
  <div>
    <app-sidebar></app-sidebar>
    <app-backdrop></app-backdrop>
  </div>
  <div
      class="flex-1 transition-all duration-300 ease-in-out"
      [ngClass]="{
        'xl:ml-[290px]': (isExpanded$ | async) || (isHovered$ | async),
        'xl:ml-[90px]': !(isExpanded$ | async) && !(isHovered$ | async),
        'ml-0': (isMobileOpen$ | async)
      }"
  >
    <!-- app header start -->
    <app-header/>
    <!-- app header end -->
    <div class="p-4 mx-auto max-w-(--breakpoint-2xl) md:p-6">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
