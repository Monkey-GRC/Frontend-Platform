<div class="relative">
  <button #trigger type="button" [id]="inputId()" (click)="toggle()" [disabled]="disabled()" data-date-trigger
    [attr.aria-haspopup]="'dialog'" [attr.aria-expanded]="open()" [attr.aria-invalid]="invalid() || null"
    class="flex h-10 w-full items-center justify-between gap-2 rounded-control border bg-surface px-3 text-left text-sm font-normal text-ink transition focus:outline-none focus:ring-2 focus:ring-action/20 disabled:cursor-not-allowed disabled:bg-tint disabled:text-ink-faint"
    [class]="invalid() ? 'border-bad focus:border-bad' : 'border-line focus:border-action'">
    @if (label(); as text) {
    <span data-date-label>{{ text }}</span>
    } @else {
    <span class="text-ink-faint" data-date-placeholder>{{ placeholderKey() | translate }}</span>
    }
    <span class="material-symbols-rounded text-[20px] text-ink-faint" aria-hidden="true">calendar_month</span>
  </button>

  @if (open()) {
  <!-- El fondo cierra el calendario al tocar fuera; en pantallas angostas, además, lo atenúa. -->
  <div class="fixed inset-0 z-[100002] bg-scrim sm:bg-transparent" (click)="close()" aria-hidden="true" data-date-backdrop></div>
  <div role="dialog" aria-modal="true" [attr.aria-label]="monthLabel()" data-date-popover (keydown)="onKey($event)"
    class="fixed z-[100003] w-[19rem] rounded-card border border-line bg-surface p-3 shadow-float max-sm:inset-x-4 max-sm:bottom-4 max-sm:w-auto"
    [style.top.px]="position()?.top ?? null" [style.left.px]="position()?.left ?? null">
    <div class="flex items-center justify-between gap-1 pb-2">
      <button type="button" (click)="shift(-1)" [attr.aria-label]="(mode() === 'days' ? 'COMMON.DATE_PICKER.PREV_MONTH' : mode() === 'months' ? 'COMMON.DATE_PICKER.PREV_YEAR' : 'COMMON.DATE_PICKER.PREV_YEARS') | translate" data-date-prev
        class="rounded-control p-2 text-ink-muted hover:bg-canvas"><span class="material-symbols-rounded text-[20px]" aria-hidden="true">chevron_left</span></button>
      <!-- El título es un botón: del día lleva a los años y, de ahí, a los meses y a los días. -->
      <button type="button" (click)="titleClick()" data-date-month [attr.aria-label]="'COMMON.DATE_PICKER.CHOOSE_YEAR' | translate" aria-live="polite"
        class="inline-flex items-center gap-1 rounded-control px-2.5 py-1.5 text-sm font-semibold text-ink hover:bg-canvas">
        {{ headerLabel() }}<span class="material-symbols-rounded text-[18px]" aria-hidden="true">{{ mode() === 'years' ? 'expand_less' : 'expand_more' }}</span>
      </button>
      <button type="button" (click)="shift(1)" [attr.aria-label]="(mode() === 'days' ? 'COMMON.DATE_PICKER.NEXT_MONTH' : mode() === 'months' ? 'COMMON.DATE_PICKER.NEXT_YEAR' : 'COMMON.DATE_PICKER.NEXT_YEARS') | translate" data-date-next
        class="rounded-control p-2 text-ink-muted hover:bg-canvas"><span class="material-symbols-rounded text-[20px]" aria-hidden="true">chevron_right</span></button>
    </div>

    @switch (mode()) {
    @case ('years') {
    <div class="grid grid-cols-3 gap-1.5 py-1" data-date-years>
      @for (y of years(); track y.year) {
      <button type="button" (click)="pickYear(y.year, y.disabled)" [disabled]="y.disabled" [attr.data-year]="y.year" [attr.aria-current]="y.current ? 'true' : null"
        class="h-11 rounded-control text-sm transition focus:outline-none focus-visible:ring-2 focus-visible:ring-action/60 disabled:cursor-not-allowed disabled:text-ink-faint disabled:hover:bg-transparent"
        [class]="y.current ? 'bg-action font-semibold text-on-action' : y.today ? 'font-semibold text-action ring-1 ring-action/50 enabled:hover:bg-tint' : 'text-ink enabled:hover:bg-canvas'">{{ y.year }}</button>
      }
    </div>
    }
    @case ('months') {
    <div class="grid grid-cols-3 gap-1.5 py-1" data-date-months>
      @for (mo of months(); track mo.m) {
      <button type="button" (click)="pickMonth(mo.m, mo.disabled)" [disabled]="mo.disabled" [attr.data-month]="mo.m" [attr.aria-current]="mo.current ? 'true' : null"
        class="h-11 rounded-control text-sm transition focus:outline-none focus-visible:ring-2 focus-visible:ring-action/60 disabled:cursor-not-allowed disabled:text-ink-faint disabled:hover:bg-transparent"
        [class]="mo.current ? 'bg-action font-semibold text-on-action' : 'text-ink enabled:hover:bg-canvas'">{{ mo.label }}</button>
      }
    </div>
    }
    @default {
    <div #grid role="grid" class="grid grid-cols-7 gap-y-1 text-center">
      @for (w of weekdays(); track $index) {
      <span class="py-1 text-xs font-medium text-ink-faint" role="columnheader">{{ w }}</span>
      }
      @for (week of weeks(); track week[0].iso) {
      @for (c of week; track c.iso) {
      <button type="button" role="gridcell" data-day [attr.data-iso]="c.iso" (click)="pick(c)" [disabled]="c.disabled"
        [attr.tabindex]="c.iso === focused() ? 0 : -1" [attr.aria-selected]="c.selected" [attr.aria-current]="c.today ? 'date' : null"
        class="mx-auto flex h-10 w-10 items-center justify-center rounded-full text-sm transition focus:outline-none focus-visible:ring-2 focus-visible:ring-action/60 disabled:cursor-not-allowed disabled:text-ink-faint disabled:hover:bg-transparent"
        [class]="c.selected ? 'bg-action font-semibold text-on-action' : c.today ? 'font-semibold text-action ring-1 ring-action/50 enabled:hover:bg-tint' : c.inMonth ? 'text-ink enabled:hover:bg-canvas' : 'text-ink-faint enabled:hover:bg-canvas'">
        {{ c.day }}
      </button>
      }
      }
    </div>
    }
    }
    <div class="mt-2 flex items-center justify-between border-t border-line pt-2">
      <button type="button" (click)="clear()" data-date-clear class="mk-btn-secondary">{{ 'COMMON.DATE_PICKER.CLEAR' | translate }}</button>
      <button type="button" (click)="selectToday()" [disabled]="!canGoToday()" data-date-today class="mk-btn-secondary">{{ 'COMMON.DATE_PICKER.TODAY' | translate }}</button>
    </div>
  </div>
  }
</div>
