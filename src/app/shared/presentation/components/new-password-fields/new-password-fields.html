<div [class]="layout() === 'row' ? 'grid gap-5 md:grid-cols-2' : 'space-y-4'">
  <app-password-field [control]="passwordControl()" inputId="new-password" autocomplete="new-password" describedBy="password-guide" [compact]="compact()" [leadingIcon]="leadingIcon()"
    [label]="'COMMON.PASSWORD.NEW' | translate" />
  <app-password-field [control]="confirmationControl()" inputId="confirm-password" autocomplete="new-password" describedBy="password-guide" [compact]="compact()" [leadingIcon]="leadingIcon()"
    [label]="'COMMON.PASSWORD.CONFIRM' | translate" />
</div>

@if (passwordError(); as message) {
  <p class="mt-1.5 text-xs text-error-500" data-testid="password-server-error">{{ message }}</p>
}

<app-password-guide class="mt-4" [password]="password()" [confirmation]="confirmation()" [current]="current()" [compact]="compact()" />
