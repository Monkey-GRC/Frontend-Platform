<app-modal [open]="open()" labelledBy="notice-title" describedBy="notice-message" size="md" testId="notice" (dismissed)="closed.emit()">
  <!-- El contenido solo existe mientras el modal está abierto: así sus campos no se crean (ni roban el foco) con la página cargada. -->
  @if (open()) {
    <div class="flex flex-col items-center text-center">
      <span class="flex h-12 w-12 items-center justify-center rounded-full bg-primary/10 text-primary dark:bg-white/10 dark:text-white">
        <span class="material-symbols-rounded text-[26px]" aria-hidden="true">{{ icon() }}</span>
      </span>
      <h2 id="notice-title" class="mt-4 text-lg font-semibold text-gray-900 dark:text-white">{{ title() }}</h2>
      <p id="notice-message" class="mt-2 text-balance text-base text-gray-600 dark:text-gray-300" data-testid="notice-message">{{ message() }}</p>
      @if (highlight()) {
        <!-- Una sola línea, siempre: el contenedor mide el ancho disponible y la letra se ajusta a él según el largo del dato (highlightFontSize). -->
        <div class="mt-3 w-full @container">
          <p class="overflow-x-auto whitespace-nowrap rounded-xl border border-primary/20 bg-primary/5 px-4 py-3 text-center font-semibold text-gray-900 dark:border-white/15 dark:bg-white/5 dark:text-white"
            [style.font-size]="highlightSize()" data-testid="notice-highlight">{{ highlight() }}</p>
        </div>
      }
      @if (hint()) {
        <p class="mt-3 text-balance text-sm text-gray-500 dark:text-gray-400" data-testid="notice-hint">{{ hint() }}</p>
      }
      <button type="button" (click)="closed.emit()" data-testid="notice-close"
        class="mt-6 inline-flex h-11 w-full items-center justify-center rounded-xl bg-primary px-6 text-base font-semibold text-white shadow-theme-sm transition hover:bg-brand-600">{{ closeLabel() }}</button>
    </div>
  }
</app-modal>
