<app-form-modal [titleKey]="'COMPLIANCE.RISK_FORM.TITLE_' + (editing() ? 'EDIT_' : 'NEW_') + kind().toUpperCase()" [descriptionKey]="'COMPLIANCE.RISK_FORM.SUBTITLE_' + kind().toUpperCase()" [dismissible]="!sending()" testId="risk-form" (closed)="closed.emit()">
  <form id="risk-form" class="flex flex-col gap-5" (submit)="$event.preventDefault(); save()" data-form novalidate>

    @if (banner(); as b) {
    <div class="flex items-start gap-2 p-3.5 text-sm mk-surface-state-bad text-ink" role="alert" data-banner><span>{{ b }}</span>
    </div>
    }

    <label class="flex flex-col gap-1.5 text-sm font-medium text-ink">
      {{ 'COMPLIANCE.RISK_FORM.NAME' | translate }}
      <input type="text" name="name" data-field="name" [value]="name()" (input)="name.set(targetValue($event))" maxlength="200"
        class="mk-input font-normal" />
      <span class="text-xs font-normal text-ink-muted">{{ 'COMPLIANCE.RISK_FORM.NAME_HINT' | translate }}</span>
      @if (errors()['name']; as e) {<span class="text-xs font-normal text-bad-ink" data-error="name">{{ e }}</span>}
    </label>

    <label class="flex flex-col gap-1.5 text-sm font-medium text-ink">
      {{ 'COMPLIANCE.RISK_FORM.DESCRIPTION' | translate }}
      <textarea name="description" data-field="description" rows="4" [value]="description()" (input)="description.set(targetValue($event))"
        class="mk-input !h-auto py-2 font-normal"></textarea>
      <span class="text-xs font-normal text-ink-muted">{{ 'COMPLIANCE.RISK_FORM.DESCRIPTION_HINT' | translate }}</span>
      @if (errors()['description']; as e) {<span class="text-xs font-normal text-bad-ink" data-error="description">{{ e }}</span>}
    </label>

    <label class="flex flex-col gap-1.5 text-sm font-medium text-ink">
      {{ (kind() === 'risk' ? 'COMPLIANCE.RISK_FORM.CRITERION' : 'COMPLIANCE.RISK_FORM.CATEGORY') | translate }}
      <select name="group" data-field="group" (change)="group.set(targetValue($event))"
        class="mk-input font-normal">
        <option value="" [selected]="!group()">{{ 'COMPLIANCE.RISK_FORM.CHOOSE' | translate }}</option>
        @for (o of groups(); track o.value) { <option [value]="o.value" [selected]="group() === o.value">{{ o.label }}</option> }
      </select>
      <span class="text-xs font-normal text-ink-muted">{{ (kind() === 'risk' ? 'COMPLIANCE.RISK_FORM.CRITERION_HINT' : 'COMPLIANCE.RISK_FORM.CATEGORY_HINT') | translate }}</span>
      @if (errors()[groupField()]; as e) {<span class="text-xs font-normal text-bad-ink" data-error="group">{{ e }}</span>}
    </label>

    @if (kind() === 'risk') {
    <fieldset class="flex flex-col gap-2 border-t border-line pt-4">
      <legend class="mb-1 text-sm font-medium text-ink">{{ 'COMPLIANCE.RISK_FORM.IMPACT' | translate }}</legend>
      <p class="text-xs text-ink-muted">{{ 'COMPLIANCE.RISK_FORM.IMPACT_HINT' | translate }}</p>
      @for (o of losses(); track o.value) {
      <label class="flex items-center gap-2 text-sm text-ink">
        <input type="checkbox" [attr.data-impact]="o.value" [checked]="impacts().includes(o.value)" (change)="toggleImpact(o.value, targetChecked($event))"
          class="h-4 w-4 rounded border-line text-action focus:ring-action/30" />
        {{ o.label }}
      </label>
      }
      @if (errors()['potential_impact']; as e) {<span class="text-xs text-bad-ink" data-error="potential_impact">{{ e }}</span>}
    </fieldset>
    }
  </form>

  <button actions type="submit" form="risk-form" [disabled]="!canSave()" data-save class="mk-btn">
    {{ (sending() ? 'COMPLIANCE.RISK_FORM.SAVING' : 'COMPLIANCE.RISK_FORM.SAVE') | translate }}
  </button>
</app-form-modal>
