<div [id]="guideId()" data-testid="password-guide" class="rounded-xl border border-gray-200 bg-gray-50 dark:border-gray-800 dark:bg-white/3" [class]="compact() ? 'p-3' : 'p-4'">
  <p class="font-medium text-gray-700 dark:text-gray-200" [class]="compact() ? 'text-xs md:text-sm' : 'text-sm'">{{ 'COMMON.PASSWORD.GUIDE.TITLE' | translate }}</p>
  <ul class="mt-3 grid gap-x-6 gap-y-2" [class]="compact() ? 'grid-cols-1' : 'sm:grid-cols-2'" aria-live="polite">
    @for (check of checks(); track check.key) {
      <li class="flex items-center gap-2 transition-colors" [attr.data-check]="check.key" [attr.data-state]="check.state" [class]="compact() ? 'text-xs md:text-sm' : 'text-sm'"
        [class.text-green-700]="check.state === 'ok'" [class.dark:text-green-400]="check.state === 'ok'"
        [class.text-error-600]="check.state === 'bad'" [class.dark:text-red-400]="check.state === 'bad'"
        [class.text-gray-500]="check.state === 'idle'" [class.dark:text-gray-400]="check.state === 'idle'">
        <span class="material-symbols-rounded text-[20px] leading-none" aria-hidden="true">{{ icon(check.state) }}</span>
        <span>{{ labelKey(check.key) | translate }}</span>
        <span class="sr-only">— {{ stateKey(check.state) | translate }}</span>
      </li>
    }
  </ul>
</div>
