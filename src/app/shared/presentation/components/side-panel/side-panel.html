<div class="fixed inset-0 z-[100000] bg-black/50" (click)="closed.emit()" aria-hidden="true"></div>
<aside
  cdkTrapFocus
  [cdkTrapFocusAutoCapture]="true"
  role="dialog"
  aria-modal="true"
  [attr.aria-labelledby]="titleId"
  class="mk-panel fixed inset-y-0 right-0 z-[100001] flex w-full flex-col border-l border-gray-200 bg-white shadow-2xl dark:border-gray-700 dark:bg-gray-900"
  [class]="size() === 'lg' ? 'max-w-2xl' : 'max-w-md'"
>
  <header class="flex items-start justify-between gap-3 border-b border-gray-200 px-5 py-4 dark:border-gray-700">
    <div class="min-w-0">
      <h2 [id]="titleId" class="truncate text-base font-semibold text-gray-900 dark:text-white">{{ titleKey() | translate: titleParams() }}</h2>
      @if (subtitleKey(); as subtitle) {
        <p class="mt-0.5 text-xs text-gray-600 dark:text-gray-300">{{ subtitle | translate: subtitleParams() }}</p>
      }
    </div>
    <button
      type="button"
      cdkFocusInitial
      (click)="closed.emit()"
      [attr.aria-label]="'COMMON.CLOSE' | translate"
      [title]="'COMMON.CLOSE' | translate"
      class="rounded-lg p-1.5 text-gray-600 hover:bg-gray-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/50 dark:text-gray-200 dark:hover:bg-gray-800"
    >
      <span class="material-symbols-rounded text-[22px]" aria-hidden="true">close</span>
    </button>
  </header>

  <div class="flex-1 overflow-y-auto px-5 py-5 text-sm">
    <ng-content />
  </div>

  <footer class="flex items-center justify-end gap-3 border-t border-gray-200 px-5 py-4 empty:hidden dark:border-gray-700">
    <ng-content select="[panelFooter]" />
  </footer>
</aside>
