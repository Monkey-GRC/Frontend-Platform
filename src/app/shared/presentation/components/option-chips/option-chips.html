<div class="flex flex-wrap gap-2.5" role="group" [attr.aria-label]="ariaLabel()">
  @for (option of options(); track option.value) {
  <button type="button" (click)="picked.emit(option.value)" [attr.aria-pressed]="isSelected(option.value)"
    class="group inline-flex items-center gap-2 rounded-full border px-4 py-2.5 text-sm font-medium transition focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/40"
    [class]="isSelected(option.value) ? 'border-primary bg-primary/10 text-primary shadow-sm dark:bg-primary/20 dark:text-white' : 'border-gray-200 bg-white text-gray-700 hover:border-primary/50 hover:bg-primary/5 dark:border-gray-700 dark:bg-gray-900 dark:text-gray-300'">
    @if (isSelected(option.value)) {
    <span class="material-symbols-rounded text-[18px] leading-none">{{ multiple() ? 'check_circle' : 'check' }}</span>
    }
    {{ option.label }}
  </button>
  }
</div>
