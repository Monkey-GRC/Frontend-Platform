<label [for]="inputId()" class="mb-2 block font-medium" [class]="compact() ? 'text-xs text-gray-400' : 'text-sm text-gray-600 dark:text-gray-300'">{{ label() }}</label>
<div class="relative">
  @if (leadingIcon(); as icon) {
    <span class="pointer-events-none absolute inset-y-0 left-3 flex items-center text-gray-500">
      <span class="material-symbols-rounded text-[20px] leading-none md:text-[22px]" aria-hidden="true">{{ icon }}</span>
    </span>
  }
  <input [id]="inputId()" [formControl]="control()" [type]="visible() ? 'text' : 'password'" [attr.autocomplete]="autocomplete()" [attr.aria-describedby]="describedBy()" placeholder="••••••••"
    class="h-10 w-full rounded-lg border border-gray-300 bg-gray-100 pr-12 text-sm transition focus:border-primary/60 focus:bg-white dark:border-gray-700 dark:bg-[#162036] dark:text-white dark:focus:bg-[#0E1525] md:h-12 md:text-base"
    [class]="leadingIcon() ? 'pl-10 md:pl-12' : 'pl-3'" />
  <!-- Centrado: ocupa toda la altura del recuadro y se centra con margen automático. Sin tooltip nativo (title): tapaba el campo de abajo; el lector de pantalla lo anuncia con aria-label. -->
  <button type="button" (click)="visible.set(!visible())" [attr.aria-pressed]="visible()" [attr.aria-label]="(visible() ? 'COMMON.HIDE_PASSWORD' : 'COMMON.SHOW_PASSWORD') | translate" data-testid="password-eye"
    class="absolute inset-y-0 right-1.5 my-auto flex h-9 w-9 items-center justify-center rounded-lg text-gray-500 transition-colors hover:text-gray-900 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/50 dark:text-gray-400 dark:hover:text-white">
    <span class="material-symbols-rounded text-[20px] leading-none md:text-[22px]" aria-hidden="true">{{ visible() ? 'visibility_off' : 'visibility' }}</span>
  </button>
</div>
