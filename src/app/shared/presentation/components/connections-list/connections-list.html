<app-data-table captionKey="TECHNICAL_CONTROL.LIST.TABLE_CAPTION" [columns]="columns" [rows]="assets()" [rowKey]="rowKey" [clickable]="true" [focusable]="false" (rowClick)="open($event)">
  <ng-template appCell="connection" let-a>
    <div class="flex items-center gap-3">
      @if (logoKey(a); as logo) {
      <app-provider-logo [logoKey]="logo" size="sm" />
      }
      <div class="min-w-0">
        <a [routerLink]="['/services', serviceId(), 'connections', a.id]" class="block font-medium text-ink hover:text-action">{{ a.name }}</a>
        <app-tag class="mt-1" [text]="a.code" />
      </div>
    </div>
  </ng-template>
  <ng-template appCell="type" let-a><span class="text-sm text-ink">{{ kind(a) }}</span></ng-template>
  <ng-template appCell="detail" let-a><span class="text-sm text-ink">{{ detail(a) || '—' }}</span></ng-template>
  <ng-template appCell="status" let-a><app-status-indicator [tone]="status(a).tone" [labelKey]="status(a).label" /></ng-template>
  <ng-template appCell="action" let-a>
    @if (canResume(a)) {
    <a [routerLink]="resumeLink(a)" [queryParams]="resumeParams(a)" (click)="$event.stopPropagation()" data-resume class="mk-btn-secondary px-3 py-2 text-xs"
      [attr.aria-label]="'TECHNICAL_CONTROL.LIST.RESUME_ARIA' | translate: { name: a.name }">{{ 'TECHNICAL_CONTROL.LIST.RESUME' | translate }}</a>
    }
  </ng-template>
</app-data-table>
