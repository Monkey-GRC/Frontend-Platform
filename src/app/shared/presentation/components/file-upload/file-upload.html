@if (labelKey(); as label) {
  <p class="mb-1.5 text-sm font-medium text-ink">{{ label | translate }}</p>
}

@if (file(); as chosen) {
  <div class="flex items-center gap-3 rounded-control border border-action/40 bg-tint p-3" data-testid="file-chosen">
    <span class="min-w-0 flex-1">
      <span class="block truncate text-sm text-ink">{{ chosen.name }}</span>
      <span class="block text-xs text-ink-muted">{{ size(chosen) }}</span>
    </span>
    <button
      type="button"
      (click)="remove()"
      [disabled]="disabled()"
      class="rounded-control px-2 py-1 text-xs font-medium text-ink-muted focus:outline-none focus-visible:ring-2 focus-visible:ring-action/50 disabled:cursor-not-allowed disabled:text-ink-faint"
    >
      {{ 'COMMON.REMOVE' | translate }}
    </button>
  </div>
} @else {
  <label
    [for]="inputId()"
    (dragover)="dragOver($event)"
    (dragleave)="dragging.set(false)"
    (drop)="drop($event)"
    class="flex cursor-pointer flex-col items-center justify-center gap-1 rounded-control border border-dashed px-4 py-6 text-center transition focus-within:ring-2 focus-within:ring-action/50"
    [class]=" (disabled() ? 'cursor-not-allowed border-line bg-tint text-ink-faint' : dragging() ? 'border-action bg-tint text-action' : 'border-line text-ink-muted hover:border-action hover:text-action') "
  >
    <span class="material-symbols-rounded text-[24px]" aria-hidden="true">upload_file</span>
    <span class="text-sm font-medium">{{ 'COMMON.FILE.DROP_OR_CLICK' | translate }}</span>
    <span class="text-xs text-ink-muted">{{ 'COMMON.FILE.ACCEPTED' | translate: { types: typesLabel(), max: maxLabel() } }}</span>
    <input [id]="inputId()" type="file" class="sr-only" [accept]="acceptAttr()" [disabled]="disabled()" (change)="pick($event)" />
  </label>
}

@if (problem(); as p) {
  <p class="mt-1.5 flex items-start gap-1.5 text-xs text-bad-ink" role="alert">{{ p.key | translate: p.params }}
  </p>
} @else if (externalError(); as e) {
  <p class="mt-1.5 flex items-start gap-1.5 text-xs text-bad-ink" role="alert">{{ e }}
  </p>
}
