@if (labelKey(); as label) {
  <p class="mb-2 text-sm font-medium text-gray-700 dark:text-gray-300">{{ label | translate }}</p>
}

@if (file(); as chosen) {
  <div class="flex items-center gap-3 rounded-lg border border-primary/40 bg-primary/5 p-3" data-testid="file-chosen">
    <span class="material-symbols-rounded text-primary" aria-hidden="true">description</span>
    <span class="min-w-0 flex-1">
      <span class="block truncate text-sm text-gray-800 dark:text-gray-200">{{ chosen.name }}</span>
      <span class="block text-xs text-gray-600 dark:text-gray-300">{{ size(chosen) }}</span>
    </span>
    <button
      type="button"
      (click)="remove()"
      [disabled]="disabled()"
      class="rounded-md px-2 py-1 text-xs font-medium text-gray-600 hover:text-error-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/50 disabled:opacity-50 dark:text-gray-300"
    >
      {{ 'COMMON.REMOVE' | translate }}
    </button>
  </div>
} @else {
  <label
    [for]="inputId()"
    (dragover)="dragOver($event)"
    (dragleave)="dragging.set(false)"
    (drop)="drop($event)"
    class="flex cursor-pointer flex-col items-center justify-center gap-1 rounded-lg border border-dashed px-4 py-6 text-center transition focus-within:ring-2 focus-within:ring-primary/50"
    [class]="
      (disabled() ? 'cursor-not-allowed opacity-60 ' : '') +
      (dragging()
        ? 'border-primary bg-primary/5 text-primary'
        : 'border-gray-300 text-gray-600 hover:border-primary hover:text-primary dark:border-gray-600 dark:text-gray-300')
    "
  >
    <span class="material-symbols-rounded text-[26px]" aria-hidden="true">upload_file</span>
    <span class="text-sm font-medium">{{ 'COMMON.FILE.DROP_OR_CLICK' | translate }}</span>
    <span class="text-xs text-gray-600 dark:text-gray-300">{{ 'COMMON.FILE.ACCEPTED' | translate: { types: typesLabel(), max: maxLabel() } }}</span>
    <input [id]="inputId()" type="file" class="sr-only" [accept]="acceptAttr()" [disabled]="disabled()" (change)="pick($event)" />
  </label>
}

@if (problem(); as p) {
  <p class="mt-1.5 flex items-start gap-1.5 text-xs text-error-600 dark:text-red-300" role="alert">
    <span class="material-symbols-rounded text-[16px]" aria-hidden="true">error</span>{{ p.key | translate: p.params }}
  </p>
} @else if (externalError(); as e) {
  <p class="mt-1.5 flex items-start gap-1.5 text-xs text-error-600 dark:text-red-300" role="alert">
    <span class="material-symbols-rounded text-[16px]" aria-hidden="true">error</span>{{ e }}
  </p>
}
