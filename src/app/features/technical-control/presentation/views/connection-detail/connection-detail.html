<section class="w-full pb-10">
  <app-breadcrumb [items]="crumbs()" />

  <div class="mt-4">
    @switch (stage()) {
    @case ('loading') {
    <app-loading-spinner />
    }
    @case ('error') {
    <app-empty-state icon="" titleKey="TECHNICAL_CONTROL.DETAIL.LOAD_ERROR_TITLE" descriptionKey="COMMON.CHECK_CONNECTION">
      <button action type="button" (click)="load()" class="mk-btn">{{ 'COMMON.RETRY' | translate }}</button>
      <a action [routerLink]="['/services', serviceId()]" class="ml-3 text-sm font-medium text-action hover:underline">{{ 'TECHNICAL_CONTROL.DETAIL.BACK_TO_SERVICE' | translate }}</a>
    </app-empty-state>
    }
    @default {
    @if (asset(); as a) {
    <app-asset-card [asset]="a" [serviceId]="serviceId()" [connectionLabel]="label()" [probeMode]="probeMode()" [frequencies]="frequencies()" [criticalities]="criticalities()"
      (changed)="onChanged($event)" (removed)="onRemoved()" />
    }
    }
    }
  </div>
</section>
