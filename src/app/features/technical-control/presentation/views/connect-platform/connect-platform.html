<section class="w-full pb-10">
  <app-breadcrumb [items]="crumbs()" />
  @if (platform(); as p) {
  <div class="mk-surface mt-3 flex items-center gap-4 p-4">
    <app-provider-logo [logoKey]="p.logo_key" />
    <div>
      <h1 class="text-2xl font-semibold text-ink">{{ 'TECHNICAL_CONTROL.CONNECT.TITLE' | translate: { name: p.name } }}</h1>
      <p class="mt-1 text-sm text-ink-muted">{{ 'TECHNICAL_CONTROL.CONNECT.SUBTITLE' | translate }}</p>
    </div>
  </div>
  }

  <div class="mt-4">
    @switch (stage()) {
    @case ('loading') {
    <app-loading-spinner />
    }
    @case ('error') {
    <app-empty-state icon="" titleKey="TECHNICAL_CONTROL.LOAD_ERROR">
      <button action type="button" (click)="load()" class="mk-btn">{{ 'COMMON.RETRY' | translate }}</button>
    </app-empty-state>
    }
    @default {
    <app-connect-asset-form [capability]="capability()!" [platform]="platform()!" [service]="service()!" [otherServices]="otherServices()"
      [criticalities]="criticalities()" (created)="onCreated($event)" (cancelled)="backToMarketplace()" />
    }
    }
  </div>
</section>
