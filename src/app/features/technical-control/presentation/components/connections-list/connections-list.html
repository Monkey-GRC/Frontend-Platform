<div class="overflow-x-auto">
  <table class="w-full min-w-[40rem] text-left text-sm">
    <thead class="text-xs text-gray-400">
      <tr class="border-b border-gray-100 dark:border-gray-800">
        <th scope="col" class="py-3 pr-4 font-medium">Conexión</th>
        <th scope="col" class="px-4 py-3 font-medium">Tipo</th>
        <th scope="col" class="px-4 py-3 font-medium">Detalle</th>
        <th scope="col" class="px-4 py-3 font-medium">Estado</th>
        <th scope="col" class="py-3 pl-4"><span class="sr-only">Abrir</span></th>
      </tr>
    </thead>
    <tbody class="divide-y divide-gray-100 dark:divide-gray-800">
      @for (a of assets(); track a.id) {
      <tr class="transition hover:bg-gray-50/60 dark:hover:bg-white/[0.02]">
        <td class="py-4 pr-4">
          <a [routerLink]="['/services', serviceId(), 'connections', a.id]" class="block font-medium text-gray-900 hover:text-primary dark:text-white">{{ a.name }}</a>
          <span class="text-xs text-gray-400">{{ a.code }}</span>
        </td>
        <td class="px-4 py-4 text-gray-600 dark:text-gray-300">{{ kind(a) }}</td>
        <td class="px-4 py-4 text-xs text-gray-500 dark:text-gray-400">{{ detail(a) || '—' }}</td>
        <td class="px-4 py-4">
          <span class="inline-flex items-center rounded-full px-3 py-1 text-xs font-medium" [class]="status(a).chip">{{ status(a).label }}</span>
        </td>
        <td class="py-4 pl-4 text-right">
          <a [routerLink]="['/services', serviceId(), 'connections', a.id]"
            class="inline-flex items-center gap-1 rounded-lg px-3 py-1.5 text-sm font-medium text-primary transition hover:bg-primary/5">
            Ver activos<span class="material-symbols-rounded text-[18px]">chevron_right</span>
          </a>
        </td>
      </tr>
      }
    </tbody>
  </table>
</div>
