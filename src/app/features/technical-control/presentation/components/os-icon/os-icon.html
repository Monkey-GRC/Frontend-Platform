<span class="inline-flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-white shadow-sm ring-1 ring-gray-200 dark:ring-gray-600">
  @if (windows()) {
  <svg viewBox="0 0 24 24" class="h-4 w-4" role="img" aria-label="Windows">
    <rect x="1" y="1" width="10.2" height="10.2" fill="#00A4EF" /><rect x="12.8" y="1" width="10.2" height="10.2" fill="#00A4EF" />
    <rect x="1" y="12.8" width="10.2" height="10.2" fill="#00A4EF" /><rect x="12.8" y="12.8" width="10.2" height="10.2" fill="#00A4EF" />
  </svg>
  } @else if (brand(); as b) {
  <svg viewBox="0 0 24 24" class="h-4 w-4" role="img" [attr.aria-label]="b.label"><path [attr.d]="b.path" [attr.fill]="b.color" /></svg>
  } @else {
  <span class="material-symbols-rounded text-[16px] text-gray-500" aria-hidden="true">help</span>
  }
</span>
