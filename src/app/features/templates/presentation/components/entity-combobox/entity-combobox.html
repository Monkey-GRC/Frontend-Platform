<div class="relative">
  <div class="relative">
    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-base">search</span>
    <input type="text" [ngModel]="query()" (ngModelChange)="query.set($event)" (focus)="onFocus()" (blur)="onBlur()"
      [disabled]="disabled || busy" [placeholder]="placeholder"
      class="w-full pl-9 pr-3 h-10 rounded-lg border border-gray-300 bg-white text-sm text-gray-800 dark:bg-gray-900 dark:border-gray-700 dark:text-white/90 focus:border-brand-300 focus:ring-3 focus:ring-brand-500/10 focus:outline-hidden disabled:opacity-50" />
  </div>

  @if (open() && !disabled) {
  <div class="absolute z-20 mt-1 w-full rounded-lg border border-gray-200 bg-white shadow-theme-md dark:border-gray-700 dark:bg-gray-800 max-h-56 overflow-y-auto">
    @for (item of filtered(); track item.id) {
    <button type="button" (mousedown)="pick(item)"
      class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50 dark:hover:bg-white/5 text-gray-700 dark:text-gray-200">
      <span class="font-medium">{{ item.label }}</span>
      @if (item.sublabel) {
      <span class="ml-1 text-xs text-gray-400">{{ item.sublabel }}</span>
      }
    </button>
    } @empty {
    <p class="px-3 py-2 text-sm text-gray-400">Sin resultados</p>
    }
    @if (query().trim() && !exactMatch()) {
    <button type="button" (mousedown)="startCreate()"
      class="w-full text-left px-3 py-2 text-sm font-medium text-brand-600 dark:text-brand-400 hover:bg-brand-50 dark:hover:bg-brand-500/10 border-t border-gray-100 dark:border-gray-700">
      + Crear "{{ query() }}"
    </button>
    }
  </div>
  }

  @if (creating()) {
  <div class="mt-2 flex flex-wrap items-end gap-2 rounded-lg border border-dashed border-brand-300 dark:border-brand-500/40 p-3">
    @if (needsRiskFields) {
    <div>
      <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">Impacto (1-5)</label>
      <input type="number" [ngModel]="impact()" (ngModelChange)="impact.set($event)" min="1" max="5"
        class="w-20 h-9 rounded-md border border-gray-300 dark:border-gray-700 dark:bg-gray-900 px-2 text-sm text-gray-800 dark:text-white/90" />
    </div>
    <div>
      <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">Probabilidad (1-5)</label>
      <input type="number" [ngModel]="probability()" (ngModelChange)="probability.set($event)" min="1" max="5"
        class="w-24 h-9 rounded-md border border-gray-300 dark:border-gray-700 dark:bg-gray-900 px-2 text-sm text-gray-800 dark:text-white/90" />
    </div>
    }
    <button type="button" (click)="confirmCreate()" [disabled]="busy"
      class="h-9 rounded-md bg-brand-500 px-3 text-sm font-medium text-white hover:bg-brand-600 disabled:opacity-60">
      {{ busy ? creatingLabel : 'Crear' }}
    </button>
    <button type="button" (click)="cancelCreate()"
      class="h-9 rounded-md px-3 text-sm text-gray-500 hover:bg-gray-100 dark:hover:bg-white/5">
      Cancelar
    </button>
  </div>
  }
</div>
