<div class="space-y-3">
  @for (template of templates; track template.id) {
    <div class="flex items-center justify-between rounded-lg border border-gray-200 p-4 dark:border-gray-800">
      <div>
        <p class="font-medium text-gray-800 dark:text-white/90">{{ template.name }}</p>
        @if (template.description) {
          <p class="text-sm text-gray-500 dark:text-gray-400">{{ template.description }}</p>
        }
      </div>
      <button
        type="button"
        [disabled]="adoptingId === template.id"
        (click)="adopt.emit(template.id)"
        class="rounded-lg bg-brand-500 px-4 py-2 text-sm font-medium text-white hover:bg-brand-600 disabled:opacity-60"
      >
        {{ adoptingId === template.id ? 'Adoptando...' : 'Adoptar' }}
      </button>
    </div>
  } @empty {
    <p class="text-sm text-gray-500 dark:text-gray-400">No hay templates maestros disponibles.</p>
  }
</div>
