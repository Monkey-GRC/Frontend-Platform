<form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
  <div>
    <label for="name" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">Nombre</label>
    <input id="name" type="text" formControlName="name"
      class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 shadow-theme-xs focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90" />
  </div>

  <div>
    <label for="slug" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">Slug</label>
    <input id="slug" type="text" formControlName="slug"
      class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 shadow-theme-xs focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90" />
  </div>

  <div>
    <label for="description" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">Descripción</label>
    <textarea id="description" formControlName="description" rows="2"
      class="w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 shadow-theme-xs focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90"></textarea>
  </div>

  <div>
    <label for="objective" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">Objetivo</label>
    <input id="objective" type="text" formControlName="objective"
      class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 shadow-theme-xs focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90" />
  </div>

  <div>
    <label for="scope" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">Alcance</label>
    <input id="scope" type="text" formControlName="scope"
      class="h-11 w-full rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-sm text-gray-800 shadow-theme-xs focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90" />
  </div>

  <button type="submit" [disabled]="loading"
    class="flex w-full items-center justify-center rounded-lg bg-brand-500 px-4 py-3 text-sm font-medium text-white shadow-theme-xs hover:bg-brand-600 disabled:opacity-60">
    {{ loading ? 'Creando...' : 'Crear y continuar' }}
  </button>
</form>
