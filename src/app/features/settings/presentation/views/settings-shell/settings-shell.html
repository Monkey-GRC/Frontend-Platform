<div class="flex min-h-screen flex-col bg-gray-50 dark:bg-gray-950 lg:flex-row">
  <aside class="flex shrink-0 flex-col border-b border-gray-200 bg-white dark:border-gray-800 dark:bg-gray-900 lg:sticky lg:top-0 lg:h-screen lg:w-72 lg:border-b-0 lg:border-r">
    <div class="p-3 lg:p-4">
      <button type="button" (click)="back()" data-testid="settings-back"
        class="flex w-full items-center gap-2.5 rounded-xl px-3 py-2.5 text-base font-medium text-gray-700 transition hover:bg-gray-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/50 dark:text-gray-200 dark:hover:bg-white/5">
        <span class="material-symbols-rounded text-[20px]" aria-hidden="true">arrow_back</span>
        {{ 'SETTINGS.BACK' | translate }}
      </button>
    </div>

    <nav [attr.aria-label]="'SETTINGS.NAV_LABEL' | translate" class="flex flex-wrap gap-1 px-3 pb-3 lg:flex-1 lg:flex-col lg:flex-nowrap lg:gap-0 lg:overflow-y-auto lg:px-4 lg:pb-6">
      @for (group of groups; track group.name) {
        <p class="hidden px-3 pb-1 pt-4 text-sm font-semibold text-gray-400 lg:block">{{ group.labelKey | translate }}</p>
        @for (section of group.sections; track section.name) {
          <a [routerLink]="section.path" routerLinkActive="bg-gray-100 text-gray-900 dark:bg-white/10 dark:text-white" [attr.data-testid]="'settings-nav-' + section.name"
            class="flex items-center gap-2.5 rounded-xl px-3 py-2.5 text-base font-medium text-gray-600 transition hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-white/5 lg:mb-0.5">
            <span class="material-symbols-rounded text-[20px]" aria-hidden="true">{{ section.icon }}</span>
            <span>{{ section.labelKey | translate }}</span>
          </a>
        }
      }
    </nav>
  </aside>

  <main class="relative min-w-0 flex-1">
    <div class="mx-auto w-full max-w-3xl px-5 py-8 md:px-8 md:py-12">
      <router-outlet />
    </div>
  </main>
</div>
