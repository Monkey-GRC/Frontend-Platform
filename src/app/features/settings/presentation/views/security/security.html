<div class="space-y-8">
  <div>
    <h1 class="text-3xl font-semibold text-gray-900 dark:text-white">{{ 'SETTINGS.SECURITY.TITLE' | translate }}</h1>
    <p class="mt-1.5 text-base text-gray-500 dark:text-gray-400">{{ 'SETTINGS.SECURITY.INTRO' | translate }}</p>
  </div>

  <app-settings-group [title]="'SETTINGS.SECURITY.GROUPS.SIGN_IN' | translate">
    <app-settings-row [title]="'SETTINGS.SECURITY.PASSWORD.TITLE' | translate" [description]="'SETTINGS.SECURITY.ROWS.PASSWORD_DESC' | translate" [link]="passwordLink" />
  </app-settings-group>

  <app-settings-group [title]="'SETTINGS.SECURITY.GROUPS.MFA' | translate">
    <app-settings-row [title]="'SETTINGS.SECURITY.ROWS.MFA_APP' | translate" [description]="'SETTINGS.SECURITY.ROWS.MFA_APP_DESC' | translate">
      <span class="inline-flex items-center gap-1.5 rounded-full bg-green-50 px-3 py-1 text-sm font-medium text-green-700 dark:bg-green-900/30 dark:text-green-300" data-testid="mfa-required">
        <span class="material-symbols-rounded text-[16px]" aria-hidden="true">check_circle</span>{{ 'SETTINGS.SECURITY.ROWS.MFA_REQUIRED' | translate }}
      </span>
    </app-settings-row>
    <app-settings-row [title]="'SETTINGS.SECURITY.RECOVERY.TITLE' | translate" [description]="'SETTINGS.SECURITY.ROWS.RECOVERY_DESC' | translate" [link]="recoveryLink" />
  </app-settings-group>
</div>
