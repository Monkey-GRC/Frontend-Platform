<section class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/3 md:p-6" data-testid="recovery-codes">
  @if (recoveryCodes().length) {
    <div class="rounded-xl border border-amber-300 bg-amber-50 p-4 dark:border-amber-700 dark:bg-amber-900/20" role="status">
      <p class="text-base font-semibold text-amber-900 dark:text-amber-200">{{ 'SETTINGS.SECURITY.RECOVERY.SHOWN_ONCE' | translate }}</p>
      <ul class="mt-3 grid grid-cols-2 gap-2 sm:grid-cols-5" data-testid="recovery-codes-list">
        @for (item of recoveryCodes(); track item) {
          <li><code class="block rounded-lg bg-white px-2 py-1.5 text-center text-sm font-bold tracking-wider text-gray-900 ring-1 ring-amber-300 dark:bg-gray-900 dark:text-white dark:ring-amber-700">{{ item }}</code></li>
        }
      </ul>
      <div class="mt-3 flex flex-wrap items-center gap-3">
        <button type="button" (click)="copy()" class="inline-flex h-9 items-center gap-1.5 rounded-xl bg-primary px-4 text-sm font-semibold text-white shadow-theme-sm transition hover:bg-brand-600">
          <span class="material-symbols-rounded text-[18px]" aria-hidden="true">{{ copied() ? 'check' : 'content_copy' }}</span>
          {{ (copied() ? 'SETTINGS.SECURITY.RECOVERY.COPIED' : 'SETTINGS.SECURITY.RECOVERY.COPY') | translate }}
        </button>
        <label class="flex items-center gap-2 text-sm text-amber-900 dark:text-amber-200">
          <input type="checkbox" [checked]="saved()" (change)="saved.set(!saved())" class="h-4 w-4" />
          {{ 'SETTINGS.SECURITY.RECOVERY.SAVED' | translate }}
        </label>
        <button type="button" (click)="dismiss()" [disabled]="!saved()" class="text-sm font-medium text-amber-900 underline disabled:opacity-50 dark:text-amber-200">{{ 'SETTINGS.SECURITY.RECOVERY.CLOSE' | translate }}</button>
      </div>
    </div>
  } @else {
    <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
      <p class="max-w-xl text-base text-gray-500 dark:text-gray-400">{{ 'SETTINGS.SECURITY.RECOVERY.IDLE_HELP' | translate }}</p>
      <button type="button" (click)="start()" data-testid="recovery-codes-start"
        class="inline-flex h-11 shrink-0 items-center justify-center gap-2 rounded-xl border border-gray-300 px-5 text-base font-semibold text-gray-700 transition hover:bg-gray-100 dark:border-gray-700 dark:text-gray-200 dark:hover:bg-white/5">
        <span class="material-symbols-rounded text-[18px]" aria-hidden="true">key</span>{{ 'SETTINGS.SECURITY.RECOVERY.GENERATE' | translate }}
      </button>
    </div>
  }
</section>

<app-second-factor-dialog [open]="asking()" [loading]="loading()" [errorMessage]="errorMessage()" [allowRecovery]="false"
  [title]="'SETTINGS.SECURITY.RECOVERY.CONFIRM_TITLE' | translate" [description]="'SETTINGS.SECURITY.RECOVERY.CONFIRM_BODY' | translate" [confirmLabel]="'SETTINGS.SECURITY.RECOVERY.CONFIRM' | translate"
  (confirmed)="generate($event)" (cancelled)="cancel()" />
