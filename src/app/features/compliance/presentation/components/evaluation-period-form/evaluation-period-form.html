<app-form-modal titleKey="COMPLIANCE.PERIOD.TITLE" descriptionKey="COMPLIANCE.PERIOD.SUBTITLE" [descriptionParams]="{ name: framework().name }" [busy]="sending()" testId="period-form" (closed)="closed.emit()">
  <form id="period-form" class="flex flex-col gap-5" (submit)="$event.preventDefault(); save()" data-form novalidate>

    @if (banner(); as b) {
    <div class="flex items-start gap-2 p-3.5 text-sm mk-surface-state-bad text-ink" role="alert" data-banner><span>{{ b }}</span>
    </div>
    }

    <div class="flex flex-col gap-1.5">
      <label for="period_start" class="text-xs font-medium text-ink-faint">{{ 'COMPLIANCE.PERIOD.START' | translate }}</label>
      <app-date-picker inputId="period_start" data-field="start" [(value)]="start" [disabled]="sending()" [invalid]="!!errors()['period_start']" />
      @if (errors()['period_start']; as e) {<span class="text-xs font-normal text-bad-ink" data-error="period_start">{{ e }}</span>}
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="period_end" class="text-xs font-medium text-ink-faint">{{ 'COMPLIANCE.PERIOD.END' | translate }}</label>
      <app-date-picker inputId="period_end" data-field="end" [(value)]="end" [min]="start() || null" [disabled]="sending()" [invalid]="!!errors()['period_end']" />
      @if (errors()['period_end']; as e) {<span class="text-xs font-normal text-bad-ink" data-error="period_end">{{ e }}</span>}
      <span class="text-xs font-normal text-ink-muted">{{ 'COMPLIANCE.PERIOD.SINGLE_DAY_HINT' | translate }}</span>
    </div>
  </form>

  <button actions type="submit" form="period-form" [disabled]="!canSave()" [appBusy]="sending()" [busyLabel]="'COMPLIANCE.PERIOD.SAVING' | translate" data-save class="mk-btn">{{ 'COMPLIANCE.PERIOD.SAVE' | translate }}</button>
</app-form-modal>
