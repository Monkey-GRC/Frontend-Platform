<app-side-panel titleKey="COMPLIANCE.PERIOD.TITLE" subtitleKey="COMPLIANCE.PERIOD.SUBTITLE" [subtitleParams]="{ name: framework().name }" (closed)="closed.emit()">
  <form class="flex flex-col gap-4" (submit)="$event.preventDefault(); save()" data-form novalidate>

    <p class="text-sm text-gray-600 dark:text-gray-300">{{ 'COMPLIANCE.PERIOD.INTRO' | translate }}</p>

    @if (banner(); as b) {
    <div class="flex items-start gap-2 rounded-xl bg-red-50 p-3.5 text-sm text-error-600 dark:bg-red-900/30 dark:text-red-300 border border-red-200 dark:border-red-800" role="alert" data-banner>
      <span class="material-symbols-rounded text-[18px]" aria-hidden="true">error</span><span>{{ b }}</span>
    </div>
    }

    <div class="flex flex-col gap-1.5">
      <label for="period_start" class="text-sm font-medium text-gray-900 dark:text-white">{{ 'COMPLIANCE.PERIOD.START' | translate }}</label>
      <app-date-picker inputId="period_start" data-field="start" [(value)]="start" [disabled]="sending()" [invalid]="!!errors()['period_start']" />
      @if (errors()['period_start']; as e) {<span class="text-xs font-normal text-error-600" data-error="period_start">{{ e }}</span>}
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="period_end" class="text-sm font-medium text-gray-900 dark:text-white">{{ 'COMPLIANCE.PERIOD.END' | translate }}</label>
      <app-date-picker inputId="period_end" data-field="end" [(value)]="end" [min]="start() || null" [disabled]="sending()" [invalid]="!!errors()['period_end']" />
      @if (errors()['period_end']; as e) {<span class="text-xs font-normal text-error-600" data-error="period_end">{{ e }}</span>}
      <span class="text-xs font-normal text-gray-600 dark:text-gray-300">{{ 'COMPLIANCE.PERIOD.SINGLE_DAY_HINT' | translate }}</span>
    </div>
  </form>

  <button panelFooter type="button" (click)="closed.emit()" data-cancel class="text-sm font-medium text-gray-700 hover:underline dark:text-gray-200">{{ 'COMMON.CANCEL' | translate }}</button>
  <button panelFooter type="button" (click)="save()" [disabled]="!canSave()" data-save
    class="inline-flex items-center gap-2 rounded-xl bg-primary px-4 py-2 text-sm font-semibold text-white shadow-theme-sm hover:bg-brand-600 disabled:cursor-not-allowed disabled:opacity-40">
    {{ (sending() ? 'COMPLIANCE.PERIOD.SAVING' : 'COMPLIANCE.PERIOD.SAVE') | translate }}
  </button>
</app-side-panel>
