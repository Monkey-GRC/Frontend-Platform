<app-side-drawer [open]="true" titleKey="COMPLIANCE.PERIOD.TITLE" subtitleKey="COMPLIANCE.PERIOD.SUBTITLE" [subtitleParams]="{ name: framework().name }" (closed)="closed.emit()">
  <form class="flex flex-col gap-4" (submit)="$event.preventDefault(); save()" data-form novalidate>

    <p class="text-sm text-ink-muted">{{ 'COMPLIANCE.PERIOD.INTRO' | translate }}</p>

    @if (banner(); as b) {
    <div class="flex items-start gap-2 p-3.5 text-sm mk-surface-state-bad text-ink" role="alert" data-banner><span>{{ b }}</span>
    </div>
    }

    <div class="flex flex-col gap-1.5">
      <label for="period_start" class="text-sm font-medium text-ink">{{ 'COMPLIANCE.PERIOD.START' | translate }}</label>
      <app-date-picker inputId="period_start" data-field="start" [(value)]="start" [disabled]="sending()" [invalid]="!!errors()['period_start']" />
      @if (errors()['period_start']; as e) {<span class="text-xs font-normal text-bad-ink" data-error="period_start">{{ e }}</span>}
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="period_end" class="text-sm font-medium text-ink">{{ 'COMPLIANCE.PERIOD.END' | translate }}</label>
      <app-date-picker inputId="period_end" data-field="end" [(value)]="end" [min]="start() || null" [disabled]="sending()" [invalid]="!!errors()['period_end']" />
      @if (errors()['period_end']; as e) {<span class="text-xs font-normal text-bad-ink" data-error="period_end">{{ e }}</span>}
      <span class="text-xs font-normal text-ink-muted">{{ 'COMPLIANCE.PERIOD.SINGLE_DAY_HINT' | translate }}</span>
    </div>
  </form>

  <button actions type="button" (click)="closed.emit()" data-cancel class="text-sm font-medium text-ink-muted hover:underline">{{ 'COMMON.CANCEL' | translate }}</button>
  <button actions type="button" (click)="save()" [disabled]="!canSave()" data-save
    class="mk-btn">
    {{ (sending() ? 'COMPLIANCE.PERIOD.SAVING' : 'COMPLIANCE.PERIOD.SAVE') | translate }}
  </button>
</app-side-drawer>
