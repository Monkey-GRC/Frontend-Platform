<app-form-modal titleKey="COMPLIANCE.APPROVAL.RESULT.TITLE" [titleParams]="{ code: testCode() }" size="lg" [busy]="sending()" [guarded]="changed()" testId="result-form" (closed)="closed.emit()">
  <form id="result-form" class="flex flex-col gap-5" (submit)="$event.preventDefault(); save()" data-form novalidate>

    @if (banner(); as b) {
    <div class="flex items-start gap-2 p-3.5 text-sm mk-surface-state-bad text-ink" role="alert" data-banner><span>{{ b }}</span></div>
    }

    <app-field labelKey="COMPLIANCE.APPROVAL.RESULT.RESULT" forId="result-value">
      <app-select inputId="result-value" data-field="result" [options]="options()" [value]="result()" placeholderKey="COMPLIANCE.APPROVAL.RESULT.PLACEHOLDER" [disabled]="sending() || optionsLoading()" (valueChange)="result.set($event)" />
    </app-field>
    @if (optionsFailed()) {
    <p class="-mt-3 text-sm text-ink" role="alert" data-options-error>{{ 'COMPLIANCE.APPROVAL.RESULT.OPTIONS_ERROR' | translate }}</p>
    }

    <app-field labelKey="COMPLIANCE.APPROVAL.RESULT.NOTE" forId="result-note" hintKey="COMPLIANCE.APPROVAL.RESULT.NOTE_HINT" [errorKey]="noteError()">
      <textarea id="result-note" rows="4" class="mk-textarea" data-field="note" [ngModel]="note()" [ngModelOptions]="{ standalone: true }" (ngModelChange)="note.set($event)" (blur)="touched.set(true)"
        [attr.aria-invalid]="noteError() || serverNote() ? 'true' : null" aria-describedby="result-note-hint"></textarea>
      @if (serverNote(); as e) {<p class="mt-1.5 text-xs text-bad-ink" role="alert" data-error="note">{{ e }}</p>}
    </app-field>
  </form>

  <button actions type="submit" form="result-form" [disabled]="!canSave()" [appBusy]="sending()" [busyLabel]="'COMPLIANCE.APPROVAL.RESULT.SENDING' | translate" data-save class="mk-btn">{{ 'COMPLIANCE.APPROVAL.RESULT.SUBMIT' | translate }}</button>
</app-form-modal>
