<section class="w-full pb-10">
  @switch (stage()) {

  @case ('loading') {
  <app-loading-spinner />
  }

  @case ('error') {
  <div class="py-12 text-center">
    <span class="material-symbols-rounded text-4xl text-gray-500 dark:text-gray-300">cloud_off</span>
    <h1 class="mt-3 text-lg font-semibold text-gray-900 dark:text-white">{{ 'COMPLIANCE.ENTRY.LOAD_ERROR_TITLE' | translate }}</h1>
    <p class="mt-1 text-sm text-gray-600 dark:text-gray-300">{{ 'COMMON.CHECK_CONNECTION' | translate }}</p>
    <button type="button" (click)="load()"
      class="mt-4 inline-flex items-center gap-2 rounded-xl bg-primary px-4 py-2.5 text-sm font-semibold text-white shadow-theme-sm hover:bg-brand-600 transition">
      <span class="material-symbols-rounded text-[18px]">refresh</span>{{ 'COMMON.RETRY' | translate }}
    </button>
  </div>
  }

  @case ('forbidden') {
  <app-empty-state icon="lock" titleKey="COMPLIANCE.ENTRY.FORBIDDEN_TITLE" descriptionKey="COMPLIANCE.ENTRY.FORBIDDEN_BODY" />
  }

  @case ('empty') {
  <app-empty-state icon="inventory_2" titleKey="COMPLIANCE.ENTRY.EMPTY_TITLE" descriptionKey="COMPLIANCE.ENTRY.EMPTY_BODY">
    <a routerLink="/services/new" class="inline-flex items-center gap-2 rounded-xl bg-primary px-4 py-2.5 text-sm font-semibold text-white shadow-theme-sm hover:bg-brand-600 transition">
      {{ 'COMPLIANCE.ENTRY.DECLARE_SERVICE' | translate }}<span class="material-symbols-rounded text-[18px]">arrow_forward</span>
    </a>
  </app-empty-state>
  }

  @default {
  <app-compliance-general [services]="services()" />
  }

  }
</section>
