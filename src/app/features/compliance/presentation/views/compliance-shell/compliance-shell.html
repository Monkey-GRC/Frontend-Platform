<section class="w-full pb-10">
  <!-- El banner del Cumplimiento (única excepción a «sin banner con fondo»): sección abierta, servicio activo, marcos, período y una línea de contexto de la sección. El cumplimiento es de un servicio y de un marco, nunca de la empresa. -->
  <app-compliance-banner [eyebrow]="'COMPLIANCE.SHELL.TITLE' | translate" [title]="section().labelKey | translate" [service]="current()?.name ?? null" [frameworks]="bannerFrameworks()"
    [selectable]="context.selectable()" [selected]="context.selected()" [frameworksLabel]="'COMPLIANCE.SHELL.FRAMEWORKS' | translate" (frameworkPick)="pickFramework($event)"
    [period]="context.evaluationText()" [canEditPeriod]="!!context.editPeriod()" (periodEdit)="editPeriod()" [insight]="context.insight()">
    @if (canSwitch()) {
    <div actions class="flex items-center gap-2">
      <label for="service-switch" class="text-xs font-medium">{{ 'COMPLIANCE.SHELL.SERVICE' | translate }}</label>
      <select id="service-switch" (change)="switchTo(targetValue($event))" class="mk-input h-9 max-w-[16rem]">
        <option [value]="GENERAL">{{ 'COMPLIANCE.SHELL.GENERAL' | translate }}</option>
        @for (s of others(); track s.id) {
        <option [value]="s.id" [selected]="s.id === serviceId()">{{ s.name }}</option>
        }
      </select>
    </div>
    }
  </app-compliance-banner>

  <div class="mt-4">
    @if (serviceId()) {
    <router-outlet />
    }
  </div>
</section>
